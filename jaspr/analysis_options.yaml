# very_good_analysis (strict-casts, strict-inference, strict-raw-types and the
# full lint set) replaced package:lints/recommended on 2026-09-22 (family
# hardening). The Jaspr analyzer plugin stays.
include: package:very_good_analysis/analysis_options.yaml

plugins:
  jaspr_lints:
    version: ^0.7.0
    diagnostics:
      prefer_html_components: true
      sort_children_last: true
      styles_ordering: true

linter:
  rules:
    avoid_positional_boolean_parameters: false
    always_put_required_named_parameters_first: false
    document_ignores: false
    comment_references: false
    public_member_api_docs: false
    # Jaspr component trees nest deeply; the site is formatted at 120 columns.
    lines_longer_than_80_chars: false

formatter:
  page_width: 120

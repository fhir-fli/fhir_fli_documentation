name: fhir_fli_docs
description: FHIR-FLI documentation site built with Jaspr
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  # Server-side syntax highlighting for fenced code blocks (see
  # lib/components/code_block.dart).
  highlight: ^0.7.0
  jaspr: ^0.23.0
  jaspr_content: ^0.5.2
  jaspr_router: ^0.8.2
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.4.17
  jaspr_builder: ^0.23.0
  very_good_analysis: ^10.1.0

jaspr:
  mode: static
